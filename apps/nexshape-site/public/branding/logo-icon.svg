<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logo-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
  </defs>
  
  <!-- Outer Ring -->
  <circle cx="100" cy="100" r="80" stroke="url(#logo-gradient)" stroke-width="2" stroke-dasharray="10 5" opacity="0.3" />
  
  <!-- Neural Network Nodes & Connections -->
  <g stroke="url(#logo-gradient)" stroke-width="1.5">
    <!-- Center Node -->
    <circle cx="100" cy="100" r="12" fill="url(#logo-gradient)" />
    <circle cx="100" cy="100" r="18" stroke="url(#logo-gradient)" stroke-opacity="0.4" />
    
    <!-- Outer Nodes -->
    <circle cx="100" cy="45" r="5" fill="url(#logo-gradient)" />
    <circle cx="155" cy="100" r="5" fill="url(#logo-gradient)" />
    <circle cx="100" cy="155" r="5" fill="url(#logo-gradient)" />
    <circle cx="45" cy="100" r="5" fill="url(#logo-gradient)" />
    
    <!-- Diagonal Nodes -->
    <circle cx="138" cy="62" r="4" fill="url(#logo-gradient)" />
    <circle cx="138" cy="138" r="4" fill="url(#logo-gradient)" />
    <circle cx="62" cy="138" r="4" fill="url(#logo-gradient)" />
    <circle cx="62" cy="62" r="4" fill="url(#logo-gradient)" />
    
    <!-- Connectivity Lines -->
    <line x1="100" y1="100" x2="100" y2="45" opacity="0.6" />
    <line x1="100" y1="100" x2="155" y2="100" opacity="0.6" />
    <line x1="100" y1="100" x2="100" y2="155" opacity="0.6" />
    <line x1="100" y1="100" x2="45" y2="100" opacity="0.6" />
    
    <line x1="100" y1="100" x2="138" y2="62" opacity="0.4" />
    <line x1="100" y1="100" x2="138" y2="138" opacity="0.4" />
    <line x1="100" y1="100" x2="62" y2="138" opacity="0.4" />
    <line x1="100" y1="100" x2="62" y2="62" opacity="0.4" />
    
    <!-- Inter-node connections -->
    <path d="M100 45 L138 62 L155 100 L138 138 L100 155 L62 138 L45 100 L62 62 Z" fill="none" opacity="0.2" />
  </g>
</svg>
